[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/iz80"]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Péricles S."]

[workspace.dependencies]
# workspace crates
emu-api      = { path = "crates/api" }
pv1000-core  = { path = "crates/core" }
emu-frontend = { path = "crates/frontend" }

# core
iz80       = "0.5"

# interface
eframe     = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
egui       = "0.37"
rfd        = "0.17"
cpal       = "0.15"
image      = { version = "0.25", default-features = false, features = ["png"] }
gif        = "0.13"
zip        = { version = "9.0", default-features = false, features = ["deflate", "bzip2"] }
sevenz-rust = "0.6"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc       = "0.2"
gilrs      = { version = "0.11", default-features = false, features = ["xinput"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# iz80 with corrected cycle counts (see vendor/iz80/README.md)
[patch.crates-io]
iz80 = { path = "vendor/iz80" }
